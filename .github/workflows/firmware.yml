name: firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v6.0.3

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3 clang-format

      - name: Checkout pico-sdk
        uses: actions/checkout@v6.0.3
        with:
          repository: raspberrypi/pico-sdk
          path: pico-sdk
          submodules: true
          ref: 2.1.1

      - name: Set PICO_SDK_PATH
        run: echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> "$GITHUB_ENV"

      # Generated headers are committed; keep make from regenerating them after checkout.
      - name: Mark generated headers up to date
        run: touch firmware/doth/easing.h firmware/doth/djfilter_tables.h

      - name: Build firmware
        working-directory: firmware
        run: make justbuild

      - name: Upload UF2s
        uses: actions/upload-artifact@v7.0.1
        with:
          name: artificial-infinite-2mb
          path: |
            firmware/build/artificial-infinite-2mb.uf2
            firmware/build/artificial-infinite-2mb-external.uf2
          if-no-files-found: error
